name = "skm-voice-agent-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

# Secrets (set via the deploy-voicebrain.yml workflow, never in this repo):
#   CF_ACCOUNT_ID  — Cloudflare account id
#   CF_API_TOKEN   — API token (server-side only, browser never sees it)
#   PROXY_KEY      — shared secret the voice agent app sends as x-proxy-key
